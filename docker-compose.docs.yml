services:
  docs:
    image: mirako_local_docs
    container_name: mirako_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./mirako:/app/mirako:z
    ports:
      - '9000:9000'
    command: /start-docs
